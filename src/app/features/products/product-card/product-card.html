<div class="border border-surface-200 rounded-lg bg-surface-0 overflow-hidden flex flex-col h-full">
    <div class="aspect-square bg-surface-50 flex items-center justify-center overflow-hidden">
      <img
        [src]="product().thumbnail"
        [alt]="product().title"
        class="w-full h-full object-contain p-2"
        loading="lazy"
      />
    </div>
  
    <div class="p-3 flex flex-col gap-3 flex-1">
      <div class="flex items-start justify-between gap-2">
        <h3 class="text-sm font-bold text-content line-clamp-2">
          {{ product().title }}
        </h3>
        <p-tag [value]="product().category" severity="secondary" styleClass="text-xs font-normal" />
      </div>
  
      @if (product().brand) {
        <p class="text-xs text-muted">{{ product().brand }}</p>
      }
  
      <div class="mt-auto flex items-baseline gap-2">
        <span class="text-lg font-semibold text-content">
          {{ discountedPrice() | currency }}
        </span>
        @if (product().discountPercentage > 0) {
          <span class="text-xs text-muted line-through">
            {{ product().price | currency }}
          </span>
        }
      </div>
  
      <div class="flex items-center justify-between text-xs">
        <span class="flex items-center gap-1 text-muted">
          <i class="pi pi-star-fill text-yellow-500"></i>
          {{ product().rating }}
        </span>
        <span class="text-muted">Stok: {{ product().stock }}</span>
      </div>
  
      <p-button
        [label]="inComparison() ? 'Karşılaştırmadan çıkar' : 'Karşılaştır'"
        [severity]="inComparison() ? 'danger' : 'secondary'"
        [outlined]="true"
        size="small"
        styleClass="w-full mt-1"
        [disabled]="compareDisabled()"
        (onClick)="onCompareClick()"
      />
    </div>
  </div>
