<div class="flex flex-col gap-4">
    <div>
        <h1 class="text-xl font-semibold text-content">Ürünler</h1>
        <p class="text-sm text-muted">Ürünleri ara, kategoriye göre filtrele</p>
    </div>

    <div class="flex flex-col sm:flex-row gap-3">
        <input pInputText [formControl]="searchControl" placeholder="Ürün ara..." class="w-full sm:max-w-xs" />

        <p-select [options]="service.categories()" optionLabel="name" optionValue="slug" [formControl]="categoryControl" placeholder="Tüm kategoriler" [showClear]="true"
            styleClass="w-full sm:w-64" />
    </div>

    @if (service.loading()) {
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        @for (s of skeletons; track $index) {
        <div class="border border-surface-200 rounded-lg overflow-hidden">
            <p-skeleton height="12rem" styleClass="!rounded-none" />
            <div class="p-3 flex flex-col gap-2">
                <p-skeleton height="1rem" width="80%" />
                <p-skeleton height="1rem" width="40%" />
                <p-skeleton height="1.5rem" width="60%" />
            </div>
        </div>
        }
    </div>
    }

    @else if (service.error()) {
    <app-error-state title="Ürünler yüklenemedi" description="Bağlantı veya sunucu hatası oluştu."
        (retry)="service.retry()" />
    }

    @else if (service.isEmpty()) {
    <app-empty-state title="Sonuc bulunamadi" description="Arama veya filtreyle eşleşen ürün yok." />
    }

    @else {
    <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
        @for (product of service.products(); track product.id) {
        <app-product-card [product]="product" />
        }
    </div>

    <p-paginator [rows]="service.pageSize" [totalRecords]="service.total()" [first]="service.page() * service.pageSize"
        (onPageChange)="onPageChange($event)" styleClass="justify-center" />
    }
</div>
