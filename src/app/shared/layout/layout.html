<div class="min-h-dvh flex flex-col bg-surface-50">
  <nav class="border-b border-surface-200 bg-surface-0 sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-indigo-500 flex items-center justify-center">
          <i class="pi pi-box text-white text-sm"></i>
        </div>
      </div>

      <div class="flex items-center gap-1 h-full">

        <a routerLink="/products" routerLinkActive="!text-black font-bold after:!scale-x-100"
          class="relative h-full flex items-center px-3 text-sm text-muted hover:text-content transition-colors after:absolute after:bottom-0 after:left-2 after:right-2 after:h-0.5 after:bg-black after:scale-x-0 after:transition-transform after:duration-200 after:origin-center">
          Ürünler
        </a>

        @if (role() === 'viewer') {

        <a routerLink="/compare" routerLinkActive="!text-black font-bold after:!scale-x-100"
          class="relative h-full flex items-center px-3 text-sm text-muted hover:text-content transition-colors after:absolute after:bottom-0 after:left-2 after:right-2 after:h-0.5 after:bg-black after:scale-x-0 after:transition-transform after:duration-200 after:origin-center">
          Karşılaştır
        </a>
        }

        @if (role() === 'admin') {

        <a routerLink="/low-stock" routerLinkActive="!text-black font-bold after:!scale-x-100"
          class="relative h-full flex items-center px-3 text-sm text-muted hover:text-content transition-colors after:absolute after:bottom-0 after:left-2 after:right-2 after:h-0.5 after:bg-black after:scale-x-0 after:transition-transform after:duration-200 after:origin-center">
          Düşük Stok
        </a>
        }
      </div>

      <div class="flex items-center">
        @if (user(); as u) {
        <button type="button" (click)="menu.toggle($event)"
          class="flex items-center gap-2 rounded-full pl-1 pr-2 py-1 hover:bg-surface-100 transition-colors"
          aria-label="Kullanici menusu">
          <span
            class="w-8 h-8 rounded-full bg-indigo-500 text-white text-xs font-semibold flex items-center justify-center">
            {{ initials() }}
          </span>
          <span class="hidden sm:inline text-sm text-content">{{ u.firstName }}</span>
          <i class="pi pi-angle-down text-xs text-muted"></i>
        </button>

        <p-menu #menu [model]="menuItems()" [popup]="true" appendTo="body" />
        }
      </div>
    </div>
  </nav>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6">
    <router-outlet />
  </main>
</div>
